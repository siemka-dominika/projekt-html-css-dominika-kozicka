<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mój sklep online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>TechShop</h1>
    <p>Najlepsza elektronika online</p>
</header>

<nav>
    <ul>
        <li>Strona główna</li>
        <li>Produkty</li>
        <li>Promocje</li>
        <li>Kontakt</li>
    </ul>
</nav>
<main>
    <h2>Nasze produkty</h2>

    <div class="product">
        <h3>Laptop</h3>
        <p>Dobry sprzęt do pracy i nauki</p>
        <strong>3500 zł</strong>
        <button>Dodaj do koszyka</button>
    </div>

    <div class="product">
        <h3>Telefon</h3>
        <p>Nowoczesny smartfon</p>
        <strong>2500 zł</strong>
        <button>Dodaj do koszyka</button>
    </div>

    <div class="product">
        <h3>Słuchawki</h3>
        <p>Bezprzewodowe i wygodne</p>
        <strong>300 zł</strong>
        <button>Dodaj do koszyka</button>
    </div>
</main>
</body>
